<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>p5.js 작품 모음</title>
  
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 50px 24px;
      /* 유리 질감이 잘 보이도록 채도를 살짝 높인 감성 파스텔 배경 */
      background: linear-gradient(120deg, #e0c3fc 0%, #8ec5fc 100%);
      
      /* 기본 폰트 대신 불러온 웹 폰트 적용 */
      font-family: 'Pretendard', sans-serif;
    }

    h1 {
      margin-bottom: 40px;
      font-size: 2.2rem;
      font-weight: 700;
      
      /* 텍스트 그라데이션 효과 (보라색 -> 진한 파란색) */
      background: linear-gradient(to right, #6a11cb 0%, #2575fc 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0px 4px 10px rgba(0,0,0,0.1); /* 글자 뒤에 아주 옅은 그림자 */
    }

     #projects {
      display: grid;
      grid-template-columns: 1fr 1fr;
      width: 100%;
      max-width: 624px; 
      gap: 24px;
    }

    #projects .cell {
      aspect-ratio: 3 / 2; 
      position: relative;
      overflow: hidden;
      border-radius: 12px;
      
      background: rgba(255, 255, 255, 0.4);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.6);
      box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.1);

      transition: transform 0.3s ease, box-shadow 0.3s ease, background 0.3s ease;
    }

    /* 마우스 오버 시: 크기 확대 및 유리창이 조금 더 불투명해지는 효과 */
    #projects .cell:hover {
      transform: scale(1.03);
      box-shadow: 0 15px 40px 0 rgba(31, 38, 135, 0.15);
      background: rgba(255, 255, 255, 0.5);
    }

    #projects .cell iframe {
      position: absolute;
      top: 0;
      left: 0;
      /* 캔버스 원본 크기인 600 x 400으로 맞춤 */
      width: 600px;
      height: 400px;
      border: none;
      transform-origin: top left;
      /* 원본을 정확히 절반으로 축소하여 카드(300x200) 안에 꽉 채움 */
      transform: scale(0.5); 
    }
    /* 클릭 유도 텍스트 스타일 */
    .click-hint {
      position: absolute;
      bottom: 20px;
      right: 20px;
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 1rem;
      font-weight: 700;
      color: #fff; /* 글자 색상 (흰색) */
      text-shadow: 0 2px 6px rgba(0, 0, 0, 0.4); /* 글자가 잘 보이도록 그림자 추가 */
      
    
      pointer-events: none; 
      

      animation: bounce 1.5s infinite ease-in-out;
      z-index: 10;
    }

   
    .click-hint .arrow {
      font-size: 1.5rem;
      display: inline-block;
      transform: rotate(180deg); /* 180도 회전하여 좌상단(↖)을 가리키게 만듦 */
      margin-right: 4px; /* 글자와 화살표 사이의 간격 살짝 조정 */
    }

    /* 통통 튀는 애니메이션 (위아래로 움직임) */
    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }
  </style>
</head>
<body>

  <h1>My p5.js Arts</h1>

  <main id="projects">
    <div class="cell">
      <iframe src="sample1/index.html"></iframe>
    </div>
    <div class="cell">
      <iframe src="sample4/index.html"></iframe>
    </div>
    <div class="cell">
      <iframe src="sample2/index.html"></iframe>
    </div>
    <div class="cell">
      <iframe src="sample3/index.html"></iframe>
      
      <div class="click-hint">
        <span class="arrow">⤵</span>
        <span>클릭해보세요!</span>
      </div>
  </main>

</body>
</html>
