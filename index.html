<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>p5.js 작품 모음</title>
  
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 50px 24px;
      /* 유리 질감이 잘 보이도록 채도를 살짝 높인 감성 파스텔 배경 */
      background: linear-gradient(120deg, #e0c3fc 0%, #8ec5fc 100%);
      
      /* 기본 폰트 대신 불러온 웹 폰트 적용 */
      font-family: 'Pretendard', sans-serif;
    }

    h1 {
      margin-bottom: 40px;
      font-size: 2.2rem;
      font-weight: 700;
      
      /* [추가됨 2] 텍스트 그라데이션 효과 (보라색 -> 진한 파란색) */
      background: linear-gradient(to right, #6a11cb 0%, #2575fc 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0px 4px 10px rgba(0,0,0,0.1); /* 글자 뒤에 아주 옅은 그림자 */
    }

    #projects {
      display: grid;
      grid-template-columns: 1fr 1fr;
      width: 100%;
      max-width: 800px;
      gap: 24px;
    }

    #projects .cell {
      aspect-ratio: 16 / 9;
      position: relative;
      overflow: hidden;
      border-radius: 12px;
      
      /* [추가됨 3] 글래스모피즘 (반투명 유리 효과) 핵심 코드 */
      background: rgba(255, 255, 255, 0.4); /* 반투명한 흰색 */
      backdrop-filter: blur(10px); /* 배경 흐리게 만들기 */
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.6); /* 빛을 받는 듯한 흰색 테두리 */
      box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.1); /* 은은하게 퍼지는 그림자 */

      transition: transform 0.3s ease, box-shadow 0.3s ease, background 0.3s ease;
    }

    /* 마우스 오버 시: 크기 확대 및 유리창이 조금 더 불투명해지는 효과 */
    #projects .cell:hover {
      transform: scale(1.03);
      box-shadow: 0 15px 40px 0 rgba(31, 38, 135, 0.15);
      background: rgba(255, 255, 255, 0.5);
    }

    #projects .cell iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 800px;
      height: 450px;
      border: none;
      transform-origin: top left;
      transform: scale(0.5); /* 800x450 캔버스를 절반으로 축소해서 딱 맞게 배치 */
    }
  </style>
</head>
<body>

  <h1>나의 p5.js 작품</h1>

  <main id="projects">
    <div class="cell">
      <iframe src="sample1/index.html"></iframe>
    </div>
    <div class="cell">
      <iframe src="sample4/index.html"></iframe>
    </div>
    <div class="cell">
      <iframe src="sample2/index.html"></iframe>
    </div>
    <div class="cell">
      <iframe src="sample3/index.html"></iframe>
    </div>
  </main>

</body>
</html>
